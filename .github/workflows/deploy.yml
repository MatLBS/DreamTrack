name: Deploy

on:
  workflow_run:
    workflows: ["Lint & Test"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/matlbs/projets/DreamTrack
            git pull
            docker compose up -d --build
            docker compose exec -T dreamtrack npm run db:migrate
