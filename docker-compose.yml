services:
  dreamtrack:
    container_name: dreamtrack
    build:
      context: .
    ports:
      - "3000:3000"
    env_file: ./.env
    environment:
      - AI_WATCH_PYTHON_SERVICE_URL=http://ai-watch-service:8008
    volumes:
      # Persistent storage for user-uploaded content (avatars, application icons)
      - dreamtrack-uploads:/app/public/uploads
    depends_on:
      - ai-watch-service
    restart: unless-stopped

  ai-watch-service:
    container_name: ai-watch-service
    build:
      context: ./ai-watch-service
    ports:
      - "8008:8008"
    environment:
      - CHROMA_PERSIST_DIRECTORY=/app/.chroma-data
    volumes:
      - ai-watch-chroma-data:/app/.chroma-data
    restart: unless-stopped

volumes:
  dreamtrack-uploads:
    driver: local
  ai-watch-chroma-data:
    driver: local
