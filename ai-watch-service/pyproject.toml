[project]
name = "ai-watch-service"
version = "0.1.0"
description = "Récupération directe des offres hiring.cafe pour la veille IA de DreamTrack."
readme = "README.md"
authors = [
    { name = "MatLBS", email = "135004599+MatLBS@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.0",
    "langchain-openai>=1.4.0",
    "langgraph>=1.2.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "langchain-openrouter>=0.2.7",
    "langsmith>=0.10.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
evals = [
    "python-dotenv>=1.0.1",
]

[project.scripts]
ai-watch-fetch = "ai_watch.__main__:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "ai_watch"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
