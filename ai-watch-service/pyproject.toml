[project]
name = "ai-watch-service"
version = "0.1.0"
description = "Récupération directe des offres hiring.cafe pour la veille IA de DreamTrack."
readme = "README.md"
authors = [
    { name = "MatLBS", email = "135004599+MatLBS@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
ai-watch-fetch = "ai_watch.__main__:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "ai_watch"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
